name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: jinwon-int/github-workflows/actions/checkout@3b20bdaac0a4ba33dbeaa1dd105f1a05d381d636 # central Node24
      - uses: jinwon-int/github-workflows/actions/setup-node@3b20bdaac0a4ba33dbeaa1dd105f1a05d381d636 # central Node24
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run doctor:field-deploy
      # Informational coverage report on the newest line only; no threshold yet.
      - run: node --test --experimental-test-coverage pr-shepherd.test.mjs
        if: matrix.node-version == '24'
